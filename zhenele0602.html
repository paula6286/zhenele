<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>练完吃啥？— 健身人专属午餐匹配</title>
<style>
:root{
  --bg:#F4F6F2;
  --card:#FFFFFF;
  --text:#151C12;
  --sub:#62745A;
  --border:#DDE3D8;
  --green:#2D6A2D;
  --green2:#4CAF50;
  --green-light:#E8F5E9;
  --accent:#FF6B35;
  --accent-light:#FFF0EB;
  --yellow:#F5C518;
  --radius:16px;
  --shadow:0 2px 16px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}

/* HERO */
.hero{
  background:linear-gradient(155deg,#0D1A0D 0%,#1A3A1A 55%,#0F2A0F 100%);
  color:#fff;padding:44px 20px 52px;text-align:center;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 60%,rgba(77,175,80,.15) 0%,transparent 55%),
             radial-gradient(ellipse at 80% 30%,rgba(255,107,53,.1) 0%,transparent 50%);
  pointer-events:none;
}
.hero-badge{
  display:inline-block;font-size:11px;letter-spacing:.1em;
  border:1px solid rgba(255,255,255,.2);border-radius:20px;
  padding:4px 14px;color:rgba(255,255,255,.6);margin-bottom:16px;
}
.hero h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:900;line-height:1.1;margin-bottom:10px;letter-spacing:-.01em;}
.hero h1 em{color:var(--green2);font-style:normal;}
.hero p{font-size:14px;color:rgba(255,255,255,.65);max-width:320px;margin:0 auto 20px;line-height:1.7;}
.hero-pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
.hero-pill{font-size:12px;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1);}
.hero-cta{border:none;background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:13px 32px;font-size:15px;cursor:pointer;box-shadow:0 4px 20px rgba(255,107,53,.4);transition:all .15s;}
.hero-cta:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,107,53,.45);}

/* WRAP */
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 60px;}

/* STEP */
.step{display:none}.step.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
.step-label{font-size:11px;color:var(--sub);letter-spacing:.1em;margin-bottom:6px;}
.step-title{font-size:22px;font-weight:900;margin-bottom:4px;}
.step-sub{font-size:13px;color:var(--sub);margin-bottom:18px;line-height:1.6;}

/* PROGRESS */
.progress{display:flex;gap:6px;align-items:center;margin-bottom:18px;}
.bar{height:4px;flex:1;background:#DDE3D8;border-radius:999px;transition:background .3s;}
.bar.on{background:var(--green);}
.progress span{font-size:12px;color:var(--sub);white-space:nowrap;margin-left:6px;}

/* EMOTION GRID — 2×4 */
.emotion-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px;}
@media(max-width:480px){.emotion-grid{grid-template-columns:repeat(2,1fr);}}
.emotion-btn{
  border:1.5px solid var(--border);background:#fff;border-radius:14px;
  padding:14px 8px;text-align:center;cursor:pointer;transition:all .18s;
}
.emotion-btn:hover{border-color:#9AB896;transform:translateY(-1px);}
.emotion-btn.active{border-color:var(--green);background:var(--green-light);}
.e-emoji{font-size:28px;margin-bottom:6px;}
.e-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.e-sub{font-size:11px;color:var(--sub);}

/* TRAIN GRID */
.train-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:400px){.train-grid{grid-template-columns:repeat(2,1fr);}}
.train-btn{
  border:1.5px solid var(--border);background:#fff;border-radius:14px;
  padding:14px 10px;text-align:center;cursor:pointer;transition:all .18s;
}
.train-btn:hover{border-color:#9AB896;}
.train-btn.active{border-color:var(--accent);background:var(--accent-light);}
.t-icon{font-size:26px;margin-bottom:6px;}
.t-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.t-note{font-size:11px;color:var(--sub);}

/* GOAL GRID */
.goal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.goal-btn{
  border:1.5px solid var(--border);background:#fff;border-radius:14px;
  padding:14px 14px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:12px;
}
.goal-btn:hover{border-color:#9AB896;}
.goal-btn.active{border-color:var(--green);background:var(--green-light);}
.g-icon{font-size:24px;flex-shrink:0;}
.g-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.g-note{font-size:11px;color:var(--sub);line-height:1.4;}

/* SECTION */
.section{margin-top:20px;}
.section-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.section-sub{font-size:12px;color:var(--sub);margin-bottom:12px;}

/* ACTIONS */
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.btn{border:none;border-radius:999px;padding:11px 22px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:disabled{background:#B8D4B6;cursor:not-allowed;}
.btn-ghost{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn-accent{background:var(--accent);color:#fff;}

/* MOOD BAR */
.moodbar{
  display:flex;align-items:flex-start;gap:14px;
  background:#fff;border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.m-emoji{font-size:32px;flex-shrink:0;}
.m-badge{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--green);background:var(--green-light);border-radius:999px;padding:2px 10px;margin-bottom:6px;display:inline-block;}
.m-name{font-size:16px;font-weight:800;margin-bottom:3px;}
.m-desc{font-size:12px;color:var(--sub);line-height:1.6;}

/* MACRO BAR */
.macro-bar{
  background:var(--green-light);border:1px solid #C5E0C5;border-radius:12px;
  padding:12px 14px;margin-bottom:16px;
}
.macro-title{font-size:12px;font-weight:700;color:var(--green);margin-bottom:10px;letter-spacing:.04em;}
.macro-row{display:flex;gap:8px;}
.macro-seg{flex:1;background:#fff;border-radius:8px;padding:8px 6px;text-align:center;border:1px solid #C5E0C5;}
.macro-val{font-size:16px;font-weight:900;color:var(--text);}
.macro-label{font-size:10px;color:var(--sub);margin-top:2px;}
.macro-pct{font-size:11px;font-weight:700;color:var(--green);margin-top:1px;}

/* RECIPE CARD */
.recipe-header{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;}
.recipe-icon{width:60px;height:60px;border-radius:14px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
.recipe-name{font-size:22px;font-weight:900;margin-bottom:4px;}
.recipe-ing{font-size:13px;color:var(--sub);line-height:1.6;}
.kcal-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-light);border-radius:999px;padding:3px 10px;margin-top:4px;}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
.tag{font-size:12px;border-radius:999px;padding:4px 12px;font-weight:600;}
.tag-g{background:var(--green-light);color:var(--green);}
.tag-o{background:var(--accent-light);color:var(--accent);}
.tag-y{background:#FFF9E0;color:#8A6B00;}

.benefit{background:#F4F6F2;border-left:4px solid var(--green);padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.7;margin:10px 0 18px;}

/* ALTERNATIVES */
.alt-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-bottom:10px;}
.alt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px;}
.alt-btn{
  border:1.5px solid var(--border);background:#FAFCFA;border-radius:12px;
  padding:12px;cursor:pointer;transition:all .15s;text-align:left;
}
.alt-btn:hover{border-color:var(--green);background:var(--green-light);}
.alt-btn.selected{border-color:var(--green);background:var(--green-light);}
.alt-icon{font-size:22px;margin-bottom:4px;}
.alt-name{font-size:14px;font-weight:700;color:var(--text);}
.alt-kcal{font-size:11px;color:var(--accent);font-weight:700;margin-top:2px;}
.alt-note{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4;}

/* APP LINKS */
.app-label{font-size:12px;color:var(--sub);margin-bottom:10px;letter-spacing:.04em;}
.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.app-btn{border:1px solid var(--border);background:#FAFCFA;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;width:100%;font-family:inherit;transition:all .15s;text-decoration:none;display:block;}
.app-btn:hover{border-color:var(--green);background:var(--green-light);}
.app-icon{font-size:26px;margin-bottom:6px;}
.app-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;}
.app-desc{font-size:11px;color:var(--sub);}

/* TIPS */
.tips-box{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px;}
.tips-title{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--sub);letter-spacing:.05em;}
.tip-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:13px;color:var(--sub);line-height:1.6;}
.tip-item:last-child{margin-bottom:0;}
.tip-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:7px;}

.footer{text-align:center;font-size:12px;color:var(--sub);padding:14px 0 28px;border-top:1px solid var(--border);margin-top:16px;}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0D1A0D;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">健身人专属 · BETA</div>
  <h1>练完<em>吃啥</em>？</h1>
  <p>情绪 × 训练状态 × 目标<br>三轴匹配，找到今天最该吃的那碗饭</p>
  <div class="hero-pills">
    <span class="hero-pill">💪 增肌 → 高蛋白主食双补</span>
    <span class="hero-pill">🔥 减脂 → 控碳水精准摄入</span>
    <span class="hero-pill">😴 恢复日 → 抗炎温补</span>
  </div>
  <button class="hero-cta" onclick="document.getElementById('app').scrollIntoView({behavior:'smooth'})">开始匹配 →</button>
</div>

<div class="wrap" id="app">

  <!-- STEP 1 -->
  <div class="step active" id="step1">
    <div class="card">
      <div class="progress">
        <div class="bar on"></div><div class="bar"></div><div class="bar"></div>
        <span>第 1 步 / 3</span>
      </div>
      <div class="step-label">STEP 01</div>
      <div class="step-title">今天心情怎么样？</div>
      <div class="step-sub">选最接近你当前状态的那一个</div>
      <div class="emotion-grid" id="emotionGrid"></div>

      <div class="section">
        <div class="section-title">今天练了吗？</div>
        <div class="section-sub">影响碳水和蛋白质的分配比例</div>
        <div class="train-grid" id="trainGrid"></div>
      </div>

      <div class="section">
        <div class="section-title">你的主要目标？</div>
        <div class="section-sub">影响热量区间和营养侧重</div>
        <div class="goal-grid" id="goalGrid"></div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="step1Next" disabled onclick="goStep2()">选好了，继续 →</button>
      </div>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step2">
    <div class="moodbar" id="moodBar"></div>
    <div class="card">
      <div class="progress">
        <div class="bar on"></div><div class="bar on"></div><div class="bar"></div>
        <span>第 2 步 / 3</span>
      </div>
      <div class="step-label">STEP 02</div>
      <div class="step-title">口味方向？</div>
      <div class="section-sub" style="margin-top:4px">先选口味，后面还有备选菜单</div>

      <div class="section">
        <div class="section-title">主要食材</div>
        <div class="section-sub">选今天最想要的蛋白质来源</div>
        <div class="train-grid" id="ingredientGrid"></div>
      </div>

      <div class="section">
        <div class="section-title">口味偏好</div>
        <div class="section-sub">选一个最顺手的方向</div>
        <div class="train-grid" id="flavorGrid"></div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" onclick="goStep(1)">← 返回</button>
        <button class="btn btn-primary" id="step2Next" disabled onclick="showResult()">匹配菜谱 →</button>
      </div>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="step" id="step3">
    <div class="moodbar" id="moodBar2"></div>
    <div class="card">
      <div class="progress">
        <div class="bar on"></div><div class="bar on"></div><div class="bar on"></div>
        <span>匹配完成</span>
      </div>
      <div class="step-label">STEP 03</div>
      <div class="step-title">今天就吃这个</div>
      <div id="resultArea"></div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="restart()">↺ 重新测一次</button>
      </div>
    </div>
  </div>

</div>
<div class="footer">练完吃啥 · 营养数据仅供参考，如有特殊需求请咨询营养师</div>
<div class="toast" id="toast"></div>

    cut:   {strength:{p:'2.2g/kg',c:'2-3g/kg',f:'0.8g/kg',kcal:'维持-300~400'},
            cardio: {p:'2.0g/kg',c:'1.5-2.5g/kg',f:'0.6g/kg',kcal:'维持-400~600'},
            rest:   {p:'1.8g/kg',c:'1-2g/kg',f:'0.6g/kg',kcal:'维持-500~700'}},
    keep:  {strength:{p:'1.6g/kg',c:'3-4g/kg',f:'1.0g/kg',kcal:'维持±0'},
            cardio: {p:'1.5g/kg',c:'2-3g/kg',f:'1.0g/kg',kcal:'维持±0'},
            rest:   {p:'1.4g/kg',c:'2-3g/kg',f:'1.0g/kg',kcal:'维持±0'}},
    recover:{strength:{p:'1.6g/kg',c:'3-4g/kg',f:'1.0g/kg',kcal:'维持±50'},
             cardio: {p:'1.5g/kg',c:'2-4g/kg',f:'1.0g/kg',kcal:'维持±0'},
             rest:   {p:'1.4g/kg',c:'2-3g/kg',f:'1.0g/kg',kcal:'维持±0'}},
  };
  var trainKey = (t==='hiit')?'cardio':(t==='yoga'||t==='plan')?'rest':(t==='rest')?'rest':t;
  return (targets[g]||targets.keep)[trainKey]||targets.keep.rest;
}

function getRecipes(){
  var trainKey=(state.train==='hiit')?'cardio':(state.train==='yoga'||state.train==='plan'||state.train==='rest')?'rest':state.train;
  var goalPool=(recipes[state.goal]||recipes.muscle)[trainKey]||recipes.muscle.rest;
  var ingKey=state.ingredient;
  var list=goalPool[ingKey]||goalPool.mixed||Object.values(goalPool)[0];
  // pick primary = first; alternatives = others
  return list;
}

function renderEmotions(){
  var html='';
  emotions.forEach(function(e){
    html+='<div class="emotion-btn'+(state.emotion===e.id?' active':'')+'" onclick="selectEmotion(\''+e.id+'\')">';
    html+='<div class="e-emoji">'+e.emoji+'</div>';
    html+='<div class="e-name">'+e.name+'</div>';
    html+='<div class="e-sub">'+e.sub+'</div>';
    html+='</div>';
  });
  document.getElementById('emotionGrid').innerHTML=html;
}

function renderTrain(){
  var html='';
  trainTypes.forEach(function(t){
    html+='<div class="train-btn'+(state.train===t.id?' active':'')+'" onclick="selectTrain(\''+t.id+'\')">';
    html+='<div class="t-icon">'+t.icon+'</div>';
    html+='<div class="t-name">'+t.name+'</div>';
    html+='<div class="t-note">'+t.note+'</div>';
    html+='</div>';
  });
  document.getElementById('trainGrid').innerHTML=html;
}

function renderGoals(){
  var html='';
  goals.forEach(function(g){
    html+='<div class="goal-btn'+(state.goal===g.id?' active':'')+'" onclick="selectGoal(\''+g.id+'\')">';
    html+='<div class="g-icon">'+g.icon+'</div>';
    html+='<div><div class="g-name">'+g.name+'</div><div class="g-note">'+g.note+'</div></div>';
    html+='</div>';
  });
  document.getElementById('goalGrid').innerHTML=html;
}

function renderIngredients(){
  var html='';
  ingredients.forEach(function(item){
    html+='<div class="train-btn'+(state.ingredient===item.id?' active':'')+'" onclick="selectIng(\''+item.id+'\')">';
    html+='<div class="t-icon">'+item.label.split(' ')[0]+'</div>';
    html+='<div class="t-name">'+item.label.split(' ').slice(1).join(' ')+'</div>';
    html+='<div class="t-note">'+item.note+'</div>';
    html+='</div>';
  });
  document.getElementById('ingredientGrid').innerHTML=html;
}

function renderFlavors(){
  var html='';
  flavors.forEach(function(item){
    html+='<div class="train-btn'+(state.flavor===item.id?' active':'')+'" onclick="selectFlavor(\''+item.id+'\')">';
    html+='<div class="t-icon">'+item.label.split(' ')[0]+'</div>';
    html+='<div class="t-name">'+item.label.split(' ').slice(1).join(' ')+'</div>';
    html+='<div class="t-note">'+item.note+'</div>';
    html+='</div>';
  });
  document.getElementById('flavorGrid').innerHTML=html;
}

function renderMoodBar(targetId){
  var e=getEmotionObj();
  var goalObj=goals.find(function(g){return g.id===state.goal;})||goals[0];
  var trainObj=trainTypes.find(function(t){return t.id===state.train;})||trainTypes[0];
  document.getElementById(targetId).innerHTML=
    '<div class="m-emoji">'+e.emoji+'</div>'+
    '<div>'+
      '<span class="m-badge">'+trainObj.icon+' '+trainObj.name+' · '+goalObj.icon+' '+goalObj.name+'</span>'+
      '<div class="m-name">当前状态：'+e.name+'</div>'+
      '<div class="m-desc">'+e.note+'</div>'+
    '</div>';
}

function selectEmotion(id){state.emotion=id;renderEmotions();updateStep1Btn();}
function selectTrain(id){state.train=id;renderTrain();updateStep1Btn();}
function selectGoal(id){state.goal=id;renderGoals();updateStep1Btn();}
function selectIng(id){state.ingredient=id;renderIngredients();updateStep2Btn();}
function selectFlavor(id){state.flavor=id;renderFlavors();updateStep2Btn();}

function updateStep1Btn(){
  document.getElementById('step1Next').disabled=!(state.emotion&&state.train&&state.goal);
}
function updateStep2Btn(){
  document.getElementById('step2Next').disabled=!(state.ingredient&&state.flavor);
}

function goStep(n){
  document.querySelectorAll('.step').forEach(function(el){el.classList.remove('active');});
  document.getElementById('step'+n).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function goStep2(){
  renderMoodBar('moodBar');
  renderMoodBar('moodBar2');
  renderIngredients();
  renderFlavors();
  goStep(2);
}

function showResult(){
  var recipes_list=getRecipes();
  var primary=recipes_list[0];
  var alts=recipes_list.slice(1);
  var macro=getMacroTarget();
  var e=getEmotionObj();
  var kw=encodeURIComponent(primary.name);

  var tagsHtml=primary.tags.map(function(t,i){
    return '<span class="tag '+(['tag-g','tag-o','tag-y'][i%3])+'">'+t+'</span>';
  }).join('');

  var altsHtml='';
  if(alts.length>0){
    altsHtml='<div class="alt-label">备选方案 — 同样适合今天</div><div class="alt-grid">';
    alts.forEach(function(a,i){
      var ak=encodeURIComponent(a.name);
      altsHtml+='<div class="alt-btn" id="alt'+i+'" onclick="swapRecipe('+i+')">';
      altsHtml+='<div class="alt-icon">'+a.icon+'</div>';
      altsHtml+='<div class="alt-name">'+a.name+'</div>';
      altsHtml+='<div class="alt-kcal">'+a.kcal+' kcal · 蛋白 '+a.p+'g</div>';
      altsHtml+='<div class="alt-note">'+a.tags[0]+'</div>';
      altsHtml+='</div>';
    });
    altsHtml+='</div>';
  }

  window.__recipeList=recipes_list;
  window.__currentRecipe=0;

  document.getElementById('resultArea').innerHTML=
    '<div class="macro-bar">'+
      '<div class="macro-title">📊 今日营养目标参考（'+
        (goals.find(function(g){return g.id===state.goal;})||goals[0]).name+
        ' · '+
        (trainTypes.find(function(t){return t.id===state.train;})||trainTypes[0]).name+
      '）</div>'+
      '<div class="macro-row">'+
        '<div class="macro-seg"><div class="macro-val">'+macro.p+'</div><div class="macro-label">蛋白质</div></div>'+
        '<div class="macro-seg"><div class="macro-val">'+macro.c+'</div><div class="macro-label">碳水</div></div>'+
        '<div class="macro-seg"><div class="macro-val">'+macro.f+'</div><div class="macro-label">脂肪</div></div>'+
        '<div class="macro-seg"><div class="macro-val" style="font-size:12px">'+macro.kcal+'</div><div class="macro-label">热量</div></div>'+
      '</div>'+
    '</div>'+
    '<div id="recipeMain">'+buildRecipeHTML(primary, kw, tagsHtml)+'</div>'+
    altsHtml+
    '<div class="tips-box">'+
      '<div class="tips-title">🧠 今日健身营养贴士</div>'+
      e.tips.map(function(t){return '<div class="tip-item"><div class="tip-dot"></div><span>'+t+'</span></div>';}).join('')+
    '</div>';

  goStep(3);
}

function buildRecipeHTML(r, kw, tagsHtml){
  if(!tagsHtml) tagsHtml=r.tags.map(function(t,i){return '<span class="tag '+(['tag-g','tag-o','tag-y'][i%3])+'">'+t+'</span>';}).join('');
  if(!kw) kw=encodeURIComponent(r.name);
  return '<div class="recipe-header">'+
    '<div class="recipe-icon">'+r.icon+'</div>'+
    '<div>'+
      '<div class="recipe-name">'+r.name+'</div>'+
      '<div class="recipe-ing">'+r.ing+'</div>'+
      '<span class="kcal-badge">🔥 '+r.kcal+' kcal &nbsp;|&nbsp; 蛋白 '+r.p+'g &nbsp;|&nbsp; 碳水 '+r.c+'g &nbsp;|&nbsp; 脂肪 '+r.f+'g</span>'+
    '</div>'+
  '</div>'+
  '<div class="tags">'+tagsHtml+'</div>'+
  '<div class="benefit"><strong>为什么适合今天：</strong>'+r.benefit+'</div>'+
  '<div class="app-label">立刻解决 — 点击唤起对应 App</div>'+
  '<div class="app-grid">'+
    '<button class="app-btn" onclick="launchApp(\'meituan\',\''+encodeURIComponent(r.name)+'\')">'+
      '<div class="app-icon">🛵</div><div class="app-name">美团 / 闪购</div><div class="app-desc">外卖配送到家</div>'+
    '</button>'+
    '<button class="app-btn" onclick="launchApp(\'dianping\',\''+encodeURIComponent(r.name)+'\')">'+
      '<div class="app-icon">⭐</div><div class="app-name">大众点评</div><div class="app-desc">附近门店评分</div>'+
    '</button>'+
    '<button class="app-btn" onclick="launchApp(\'xiachufang\',\''+encodeURIComponent(r.name)+'\')">'+
      '<div class="app-icon">🍳</div><div class="app-name">下厨房</div><div class="app-desc">自己做菜谱</div>'+
    '</button>'+
  '</div>';
}

function swapRecipe(idx){
  window.__currentRecipe=idx+1;
  var r=window.__recipeList[idx+1];
  document.getElementById('recipeMain').innerHTML=buildRecipeHTML(r,null,null);
  document.querySelectorAll('.alt-btn').forEach(function(b,i){
    b.classList.toggle('selected',i===idx);
  });
  showToast('已切换到：'+r.name);
}

function launchApp(platform, kw){
  var decoded=decodeURIComponent(kw);
  var webUrls={
    meituan:'https://h5.meituan.com/awp/i/seo-search.html?q='+kw,
    dianping:'https://www.dianping.com/search/keyword/2/0_'+decoded,
    xiachufang:'https://www.xiachufang.com/search/?keyword='+decoded,
  };
  var url=webUrls[platform];
  if(!url)return;

  showToast('打开 '+['美团','大众点评','下厨房'][['meituan','dianping','xiachufang'].indexOf(platform)]+'…');
  window.open(url,'_blank');
}

function restart(){
  state={emotion:'',train:'',goal:'',ingredient:'',flavor:''};
  renderEmotions();renderTrain();renderGoals();
  document.getElementById('step1Next').disabled=true;
  document.getElementById('step2Next').disabled=true;
  goStep(1);
}

function showToast(text){
  var t=document.getElementById('toast');
  t.textContent=text;t.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt=setTimeout(function(){t.classList.remove('show');},2200);
}

renderEmotions();renderTrain();renderGoals();
</script>
</body>
</html>
